name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas, lint y APK debug
        run: ./gradlew test lint assembleDebug --console=plain
      - name: Compilar release (R8) y las pruebas instrumentadas
        run: ./gradlew assembleRelease assembleDebugAndroidTest --console=plain
      - name: Verificar que el manifiesto final no declara INTERNET
        run: |
          manifiesto=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -n 1)
          test -n "$manifiesto"
          if grep -q "android.permission.INTERNET" "$manifiesto"; then
            echo "El manifiesto declara INTERNET"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  herramientas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del importador y de los scripts de contenido
        run: |
          python -m pip install -r tools/importar_biblia/requirements.txt
          (cd tools/importar_biblia && python -m pytest -q)
          python -m pytest tools/contenido -q
